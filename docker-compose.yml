services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torre_faro}
      POSTGRES_USER: ${POSTGRES_USER:-torre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torre} -d ${POSTGRES_DB:-torre_faro}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-torre}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-torre_faro}
      TF_ADMIN_USER: ${TF_ADMIN_USER:?Definí TF_ADMIN_USER en .env}
      TF_ADMIN_PASSWORD: ${TF_ADMIN_PASSWORD:?Definí TF_ADMIN_PASSWORD en .env}
      TF_AUTH_SECRET: ${TF_AUTH_SECRET:?Definí TF_AUTH_SECRET en .env}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
